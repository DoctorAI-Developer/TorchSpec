model:
  target_model_path: /home/ubuntu/.cache/huggingface/hub/models--Qwen--Qwen3.8-27B-FP8/snapshots/017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
  trust_remote_code: true
  target_model_backend: hf
  draft_model_config: ${oc.env:QWEN38_SELECTOR_INITIAL_DRAFT,/home/ubuntu/qwen38-results/drafts/qwen38-dflash2-selector-only-path-v1-lr1e-5-step10}
  initial_draft_model_path: ${oc.env:QWEN38_SELECTOR_INITIAL_DRAFT,/home/ubuntu/qwen38-results/drafts/qwen38-dflash2-selector-only-path-v1-lr1e-5-step10}
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  norm_key: model.language_model.norm.weight

dataset:
  train_data_path: ""
  eval_data_path: null
  min_loss_tokens: 16
  shuffle_dataset: true

training:
  attention_backend: flex_attention
  colocate: false
  micro_batch_size: 1
  gradient_checkpointing: false
  draft_accumulation_steps: 2
  # Reach loss repeats evidence along a prefix, so start below both rejected
  # selector continuations. Steps 2/4/6/8/10 are screened with the exact B12
  # allocator; trainer loss cannot promote a checkpoint by itself.
  learning_rate: ${oc.env:QWEN38_SELECTOR_LR,1e-6}
  min_lr: ${oc.env:QWEN38_SELECTOR_MIN_LR,1e-7}
  weight_decay: 0.0
  max_concurrent_batches: 1
  max_grad_norm: 0.5
  max_seq_length: 8192
  num_epochs: 1
  num_train_steps: ${oc.env:QWEN38_SELECTOR_TRAIN_STEPS,10}
  seed: 20260821
  training_num_gpus_per_node: 1
  training_num_nodes: 1
  fsdp_strategy: REPLICATE
  fsdp_reduce_dtype: bfloat16
  prefetch_depth: 1
  save_interval: ${oc.env:QWEN38_SELECTOR_SAVE_INTERVAL,2}
  save_per_epoch: true
  max_checkpoints: 6
  warmup_ratio: 0.0
  dflash_block_size: 8
  dflash_num_anchors: 1024
  dflash_num_target_layers: 5
  dflash_loss_objective: opd
  dflash_ce_loss_alpha: 0.0
  dflash_l1_loss_alpha: 0.0
  dflash2_logits_chunk_size: 32
  dflash2_trainable_scope: selector_only
  dflash2_selector_loss_alpha: 1.0
  dflash2_selector_objective: sampling_taps
  dflash2_selector_token_map_path: /home/ubuntu/llm-inference/benchmark/artifacts/token_maps/qwen38-dflash2-doctorai-candidate-support-v1-65536.pt
  dflash2_selector_token_map_sha256: 08e731bae72c6142448fd2939f454ff1d6133fb4fdd882f209a204119c7eb4eb
  dflash2_selector_temperature: 1.0
  # The current implementation distills the strict-greedy target path. These
  # fields are fail-closed in config and model validation.
  dflash2_selector_verifier_temperature: 0.0
  dflash2_selector_verifier_top_k: 1
  dflash2_selector_verifier_top_p: 1.0
  # Match the qualified serving allocator. Local loss is one-hot target KL
  # with the target-entropy constant omitted. Reach BCE covers positive gold
  # prefixes and selected off-path nodes, excluding frozen-support misses.
  dflash2_selector_tree_budget: 12
  dflash2_selector_tree_depth_log_bias: -0.375
  dflash2_selector_taps_local_weight: ${oc.env:QWEN38_TAPS_LOCAL_WEIGHT,1.0}
  dflash2_selector_taps_reach_weight: ${oc.env:QWEN38_TAPS_REACH_WEIGHT,0.1}
  dflash2_opd_rejected_stream_weight: 0.0
  dflash2_opd_accepted_objective: forward_kl

inference:
  inference_engine_type: offline
  store_last_hidden_states: true
  inference_num_gpus: null
  inference_num_gpus_per_engine: 1
  inference_num_gpus_per_node: 1
  max_sample_pool_size: 4
  inference_buffer_threshold: 2
  inference_batch_size: 1
  inference_fetch_batch: 1
  aux_hidden_states_layers: [5, 19, 33, 47, 61]
  offline:
    data_path: ${oc.env:QWEN38_OPD_OFFLINE_DATASET,/home/ubuntu/qwen38-results/offline/qwen38-dflash2-opd-medium-greedy-promoted-v3}
    num_engines: 1

logging:
  report_to: none
  use_wandb: false
  use_tensorboard: false

output_dir: ${oc.env:QWEN38_SELECTOR_OUTPUT,/home/ubuntu/dflash2-work/torchspec/outputs/qwen38-dflash2-selector-only-taps-v4}
cache_dir: ${oc.env:QWEN38_SELECTOR_CACHE,/home/ubuntu/dflash2-work/torchspec/cache/qwen38-dflash2-selector-only-taps-v4}
model_download_dir: null

debug:
  enable_perf_metrics: true
  max_dump_steps: 5
  memory_recorder: torch
  profile_step_start: 0
  profile_step_end: 0
  profile_target: [train_overall]
  record_memory_history: false
  use_pytorch_profiler: false
